<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rhythm</title>
  <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500&display=swap" rel="stylesheet">
  <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
    
    <div id="splash">
        <div id="logo">Rhythm</div>
        <div id="loading">Loading<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>
    </div>

    <video id="bgVideo" autoplay loop muted playsinline>
      <source src="./bg/1.webm" type="video/mp4" />
      <!-- fallback image or text -->
    </video>

    <button id="prevBg" class="bg-nav-btn left">
      <span class="material-symbols-rounded">arrow_back_ios_new</span>
    </button>
    <button id="nextBg" class="bg-nav-btn right">
      <span class="material-symbols-rounded">arrow_forward_ios</span>
    </button>

    <div id="clock-container">
      <span class="material-symbols-rounded" id="clock-icon">schedule</span>
      <span id="clock-time"></span>
    </div>
 

  <!-- YouTube API loads here -->
  <div id="ytplayer"></div>

  <!-- Ambient Controls -->
  <div id="ambient-controls">
    
    <div class="slider-container" id="rain">
      <input type="range" min="0" max="1" step="0.01" value="0.1" />
      <label>Rain</label>
    </div>

    <div class="slider-container" id="thunder">
      <input type="range" min="0" max="1" step="0.01" value="0.1" />
      <label>Thunder</label>
    </div>

    <div class="slider-container" id="wind">
      <input type="range" min="0" max="1" step="0.01" value="0.1" />
      <label>Wind</label>
    </div>


    <div class="slider-container" id="train">
      <input type="range" min="0" max="1" step="0.01" value="0.1" />
      <label>Train</label>
    </div>

    <div class="slider-container" id="bird">
      <input type="range" min="0" max="1" step="0.01" value="0.2" />
      <label>Bird</label>
    </div>

    <div class="slider-container" id="seawaves">
      <input type="range" min="0" max="1" step="0.01" value="0.2" />
      <label>Sea</label>
    </div>

  </div>

  <!-- Player Bar -->
  <div id="player-bar">
      <div id="player-title" style="font-family: 'Pacifico', cursive; color: #f7c873; font-size: 1.5rem; margin-right: 28px;">
    Rhythm v1.1
      </div>
    <button id="playPause">
      <span id="playPauseIcon" class="material-symbols-rounded">play_arrow</span>
    </button>
    <input type="range" id="lofiVolume" min="0" max="1" step="0.01" value="0.8" />

   
    <div id="channel-dropdown-container" style=position:relative;">
      <button id="channelDropdownBtn" class="material-symbols-rounded" style="background:none; border:none; color:#f7c873; font-size:2rem; cursor:pointer;">
        expand_less
      </button>
      <ul id="channelDropdownMenu" style="display:none; position:absolute; bottom:48px; right:0; background:rgba(34,34,34,0.95); border-radius:12px; box-shadow:0 2px 12px rgba(60,40,90,0.18); list-style:none; padding:8px 0; margin:0; min-width:160px; z-index:100;">
        <!-- JS will populate this -->
      </ul>
    </div>

  </div>
  

  <script src="script.js"></script>
</body>
</html>
